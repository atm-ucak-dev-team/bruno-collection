info:
  name: Get Issue
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/v1/jira/issues?search=passkey&limit=10"
  headers:
    - name: X-Jira-Access-Token
      value: "{{jiraBearerToken}}"
    - name: X-User-Cloud-ID
      value: "{{cloudId}}"
    - name: X-User-Dummy-Id
      value: "123"
  params:
    - name: search
      value: passkey
      type: query
    - name: limit
      value: "10"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    description: Success Response
    request:
      url: "{{baseURL}}/api/v1/jira/issues?search=passkey&limit=10"
      method: GET
      headers:
        - name: X-Jira-Access-Token
          value: "{{jiraBearerToken}}"
        - name: X-User-Cloud-ID
          value: "{{cloudId}}"
        - name: X-User-Dummy-Id
          value: "123"
      params:
        - name: search
          value: passkey
          type: query
        - name: limit
          value: "10"
          type: query
