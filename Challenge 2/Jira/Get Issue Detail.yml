info:
  name: Get Issue Detail
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/v1/jira/issues/10000"
  headers:
    - name: X-Jira-Access-Token
      value: "{{jiraBearerToken}}"
    - name: X-User-Cloud-ID
      value: "{{cloudId}}"
    - name: X-User-Dummy-Id
      value: "123"

settings:
