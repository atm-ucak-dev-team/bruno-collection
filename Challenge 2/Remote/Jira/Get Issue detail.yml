info:
  name: Get Issue detail
  type: http
  seq: 4

http:
  method: get
  url: https://api.atlassian.com/ex/jira/{{cloudId}}/rest/api/2/issue/{{issueID}}
  headers:
    - name: Authorization
      value: Bearer {{jiraBearerToken}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: issueID
      value: "10000"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
