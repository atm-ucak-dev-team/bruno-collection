info:
  name: Get Issues JQL
  type: http
  seq: 5

http:
  method: get
  url: https://api.atlassian.com/ex/jira/{{cloudId}}/rest/api/2/search/jql?jql=assignee = currentUser() and (key = "" or summary ~ "passkey")&maxResults=10&fields=summary,status,customfield_10072
  headers:
    - name: Authorization
      value: Bearer {{jiraBearerToken}}
    - name: Accept
      value: application/json
  params:
    - name: jql
      value: assignee = currentUser() and (key = "" or summary ~ "passkey")
      type: query
    - name: maxResults
      value: "10"
      type: query
    - name: fields
      value: summary,status,customfield_10072
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
